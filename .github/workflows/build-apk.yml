          FIN_ARCHIVO
          cat > 'gradle.properties' <<'FIN_ARCHIVO'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          FIN_ARCHIVO
          mkdir -p 'gradle/wrapper'
          cat > 'gradle/wrapper/gradle-wrapper.properties' <<'FIN_ARCHIVO'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.7-bin.zip
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          FIN_ARCHIVO
          cat > 'settings.gradle.kts' <<'FIN_ARCHIVO'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "ZipInstaller"
          include(":app")
          FIN_ARCHIVO

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar APK (debug)
        working-directory: ZipInstaller
        run: gradle assembleDebug --no-daemon

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: ZipInstaller-apk
          path: ZipInstaller/app/build/outputs/apk/debug/app-debug.apk
